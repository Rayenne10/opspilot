name: Verify and package OpsPilot
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q --junitxml=test-results.xml
      - run: python scripts/evaluate.py --mode demo --output evaluation/local-ci-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-python-${{ matrix.python }}
          path: |
            test-results.xml
            evaluation/local-ci-results.json
  browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: pip install .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: docs/assets/*.png
  container:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: opspilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test built container
        run: |
          docker run -d --name opspilot -p 127.0.0.1:8000:8000 opspilot:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/readyz
          curl --fail -H 'Content-Type: application/json' -d '{"title":"CI memory incident","events":"OOMKilled"}' http://127.0.0.1:8000/api/analyze
          docker rm -f opspilot
      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
