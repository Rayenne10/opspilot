apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.1
          ports: [{name: http, containerPort: 6333}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /qdrant/storage}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: qdrant-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector: {app: qdrant}
  ports: [{name: http, port: 6333, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-ingress
spec:
  podSelector:
    matchLabels: {app: qdrant}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: opspilot}
      ports: [{protocol: TCP, port: 6333}]
