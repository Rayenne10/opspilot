apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - {name: OPSPILOT_MODE, value: live}
            - {name: QDRANT_URL, value: "http://qdrant:6333"}
            - {name: OPENAI_MODEL, value: gpt-4.1-mini}
            - {name: OPENAI_EMBEDDING_MODEL, value: text-embedding-3-small}
            - {name: OPENAI_EMBEDDING_DIMENSIONS, value: "1536"}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: opspilot-secrets, key: openai-api-key}
