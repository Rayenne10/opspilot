apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot
spec:
  replicas: 1
  selector:
    matchLabels: {app: opspilot}
  template:
    metadata:
      labels: {app: opspilot}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: opspilot:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: OPSPILOT_MODE, value: demo}
            - name: OPSPILOT_API_TOKEN
              valueFrom:
                secretKeyRef: {name: opspilot-secrets, key: api-token, optional: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 32Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot
spec:
  selector: {app: opspilot}
  ports: [{name: http, port: 8000, targetPort: http}]
