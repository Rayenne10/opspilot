[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Evidence-grounded Kubernetes incident investigation with RAG"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "pydantic==2.14.0",
  "httpx==0.28.1", "openai==1.109.1", "qdrant-client==1.19.1",
  "prometheus-client==0.26.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
